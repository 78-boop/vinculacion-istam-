<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#053324">
    <title>Sin conexión · Vinculación ISTAM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0F2A20; text-align: center;
            background: radial-gradient(120% 70% at 50% 0%, #E7F5EE, #F2F6F4 60%);
        }
        .caja { max-width: 340px; }
        .logo { width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 26px; background: #fff; display: grid; place-items: center; box-shadow: 0 18px 40px -16px rgba(0,107,71,.5); }
        .logo img { width: 58px; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 24px; color: #4A5F55; line-height: 1.5; font-size: 15px; }
        button {
            border: 0; border-radius: 14px; padding: 14px 26px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
            background: linear-gradient(135deg, #00875A, #006B47); box-shadow: 0 12px 24px -12px rgba(0,107,71,.9);
        }
    </style>
</head>
<body>
    <div class="caja">
        <div class="logo"><img src="/images/logo-istam.png" alt="ISTAM"></div>
        <h1>Sin conexión</h1>
        <p>No pudimos conectarnos con el sistema. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
